<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vendor/Workroom Directory</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#F5F6F7;
    --surface:#FFFFFF;
    --ink:#0E2841;
    --ink-body:#23303B;
    --ink-soft:#5C6B76;
    --ink-faint:#8B98A1;
    --line:#E8E8E8;
    --accent:#E97132;
    --accent-hover:#C85A1F;
    --accent-soft:#FCE7D8;
    --danger:#A02B93;
    --warn:#B3261E;
    --warn-bg:#FBEAEA;
    --radius:10px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink-body);
    font-family:'Poppins', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  #root{ max-width:1180px; margin:0 auto; padding:36px 28px 80px; }

  /* ---------- Header ---------- */
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 6px;
  }
  h1{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:32px;
    margin:0 0 22px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }

  .toolbar{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:18px;
  }
  .search-wrap{
    position:relative;
    flex:1 1 260px;
  }
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; stroke:var(--ink-faint);
  }
  input[type="text"], select, textarea{
    font-family:'Poppins', sans-serif;
    font-size:14px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    border-radius:8px;
    padding:10px 12px;
  }
  .search-wrap input{ width:100%; padding-left:34px; }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  .btn{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-ghost:hover{ background:var(--accent-soft); }
  .btn-danger-text{ background:transparent; border:none; color:var(--danger); font-weight:600; font-size:13px; cursor:pointer; padding:8px 4px; }

  /* ---------- Filters ---------- */
  .filters{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line);
  }
  .filter-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--ink-faint); margin-right:4px;
  }
  .chip{
    font-size:13px; font-weight:500;
    padding:6px 12px; border-radius:100px;
    border:1px solid var(--line); background:var(--surface);
    cursor:pointer; color:var(--ink-soft); user-select:none;
  }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .filters select{ min-width:150px; }
  .clear-link{
    font-size:13px; color:var(--ink-faint); text-decoration:underline; cursor:pointer; margin-left:auto;
    background:none; border:none; font-family:'Poppins',sans-serif;
  }

  .count-line{ font-size:13px; color:var(--ink-faint); margin-bottom:14px; }

  /* ---------- Grid / Cards ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,36,32,0.08); }
  .dnu-section{ margin-top:32px; padding-top:22px; border-top:1px solid var(--line); }
  .dnu-heading{
    font-family:'Poppins', sans-serif; font-weight:700; font-size:15px;
    color:var(--warn); margin:0 0 14px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .card-dnu{ border-color:#E3B8B8; }
  .card-dnu:hover{ box-shadow:0 6px 18px rgba(179,38,30,0.12); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .tab{
    padding:7px 16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#fff;
  }
  .tab-multi{ display:flex; padding:0; }
  .tab-seg{
    flex:1 1 0; min-width:0; padding:7px 12px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tab-seg:first-child{ padding-left:16px; }
  .card-body{ padding:16px; flex:1; display:flex; flex-direction:column; gap:8px; }
  .vendor-name{
    font-family:'Poppins', sans-serif;
    font-weight:700; font-size:18px; line-height:1.25;
    color:var(--ink);
  }
  .meta-row{
    font-size:13px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
  }
  .meta-row svg{ width:13px; height:13px; stroke:var(--ink-faint); flex-shrink:0; margin-top:3px; }
  .meta-row{ align-items:flex-start; }
  .meta-text{ min-width:0; overflow-wrap:anywhere; }
  .meta-row.nowrap .meta-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta-row a{ color:#156082; text-decoration:none; }
  .meta-row a:hover{ text-decoration:underline; }
  .notes-preview{
    font-size:13px; color:var(--ink-faint);
    line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    margin-top:2px;
  }

  /* ---------- Empty / loading ---------- */
  .empty-state, .loading-state{
    text-align:center; padding:80px 20px; color:var(--ink-faint);
  }
  .empty-state h2{
    font-family:'Poppins', sans-serif; font-weight:800; color:var(--ink); font-size:20px; margin-bottom:8px;
  }
  .empty-state p{ font-size:14px; margin-bottom:20px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,26,20,0.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 20px; overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--surface); border-radius:14px; width:100%; max-width:520px;
    padding:28px; margin-top:10px;
  }
  .modal h2{
    font-family:'Poppins', sans-serif; font-weight:800; font-size:22px; margin:0 0 20px;
  }
  .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .field input, .field select, .field textarea{ width:100%; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  textarea{ resize:vertical; min-height:64px; font-family:'Poppins',sans-serif; }
  .pick-group{ margin-bottom:14px; }
  .pick-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block; }
  .pick-pills{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .pill{
    font-family:'Poppins', sans-serif; font-size:12px; font-weight:500;
    padding:4px 11px; border-radius:100px; cursor:pointer;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  }
  .pill:hover{ border-color:var(--ink-faint); }
  .pill.on{ color:#fff; border-color:transparent; }
  .pick-add{ display:flex; gap:6px; }
  .pick-add input{ flex:1; padding:6px 10px; font-size:13px; }
  .pick-add button{ padding:6px 12px; font-size:13px; }
  .dnu-field{ background:#FBEAEA; border:1px solid #E3B8B8; border-radius:8px; padding:10px 12px; }
  .dnu-checkbox-label{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--warn); cursor:pointer; }
  .dnu-checkbox-label input{ width:16px; height:16px; accent-color:var(--warn); }
  .dnu-field textarea{ margin-top:10px; width:100%; min-height:50px; }
  .modal-actions{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
  }
  .modal-actions-right{ display:flex; gap:10px; }

  #loginGate{
    position:fixed; inset:0; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:100;
  }
  .login-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:32px; width:100%; max-width:360px;
  }
  .login-card .field{ margin-bottom:14px; }
  .login-card label{ font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; }
  .login-card input{ width:100%; }

  @media (max-width:520px){
    #root{ padding:24px 16px 60px; }
    h1{ font-size:26px; }
    .field-row{ flex-direction:column; gap:0; }
  }
</style>
</head>

<!-- Firebase (replaces Claude artifact's window.storage — same get/set shape, backed by Firestore) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCDgDzg0FbHdvHuyHBxKo_UC2_Y9bUOjYc",
    authDomain: "sourcing-directory.firebaseapp.com",
    projectId: "sourcing-directory",
    storageBucket: "sourcing-directory.firebasestorage.app",
    messagingSenderId: "341386104099",
    appId: "1:341386104099:web:6f7e13e5793934a49e1096"
  };
  firebase.initializeApp(firebaseConfig);
  const _db = firebase.firestore();

  // Shim matching the original window.storage.get/set(key, shared) -> {key,value,shared}|null
  // interface, so the rest of the app's code (loadVendors, saveVendors, seed blocks, etc.)
  // needs zero changes. All data lives in a single Firestore collection called "kv".
  window.storage = {
    get: async (key) => {
      const doc = await _db.collection('kv').doc(key).get();
      if (!doc.exists) throw new Error('Key not found: ' + key);
      return { key, value: doc.data().value, shared: true };
    },
    set: async (key, value) => {
      await _db.collection('kv').doc(key).set({ value });
      return { key, value, shared: true };
    },
  };

  // --- Real authentication (Firebase Auth), not a cosmetic password box ---
  // Firestore's rules require request.auth != null, so the database itself
  // rejects anyone who hasn't actually signed in — this isn't just a UI gate.
  const _auth = firebase.auth();

  function showApp(){
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('root').style.display = 'block';
    if (typeof window.__startVendorApp === 'function'){
      window.__startVendorApp();
    }
  }
  function showLogin(){
    document.getElementById('loginGate').style.display = 'flex';
    document.getElementById('root').style.display = 'none';
  }

  _auth.onAuthStateChanged((user) => {
    if (user) showApp();
    else showLogin();
  });

  function attemptLogin(){
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errBox = document.getElementById('loginError');
    errBox.style.display = 'none';
    if (!email || !password){
      errBox.textContent = 'Please enter both email and password.';
      errBox.style.display = 'block';
      return;
    }
    _auth.signInWithEmailAndPassword(email, password).catch((err) => {
      errBox.textContent = 'Incorrect email or password.';
      errBox.style.display = 'block';
      console.error('Sign-in error', err);
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('loginBtn').addEventListener('click', attemptLogin);
    ['login-email', 'login-password'].forEach((id) => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){ e.preventDefault(); attemptLogin(); }
      });
    });
    document.getElementById('signOutBtn').addEventListener('click', () => {
      _auth.signOut();
    });
  });
</script>

  function withTimeout(promise, ms, label){

      promise,

  function uniqueSorted(arr){
    return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  }

  // The full set of categories and locations from the team's original spreadsheet,
  // shown as filter/autocomplete options even before any vendor is added under them.
  const ALL_CATEGORIES = ["Upholstery","Casework","Window","Plaster","Stone","Fabricators",
    "Rug Repair","Storage","Moving/Install","Framing","Cleaning","Contractors","Painters",
    "Wallpaper Install","Furniture Repair","Showrooms","Other","Florists","Consignment/Auction/Estate Sales"];
  const ALL_LOCATIONS = ["Los Angeles","San Francisco","New York","Texas","Montana","Michigan",
    "San Diego","Salt Lake City","Missoula","Kalispell","Harbor Springs","Houston","Phoenix",
    "Orange County","Georgia","Seattle","Boston","Italy","Australia"];

  // ---------- Location hierarchy ----------
  // A vendor tagged with a place automatically shows up under every broader area that
  // contains it: e.g. "Los Angeles" is also found under Southern California, California
  // and USA. To teach the app a new place, add a line to LOCATION_PARENTS
  // (place -> the broader area(s) it sits inside). Places not listed here still work,
  // they just only match themselves.
  const LOCATION_PARENTS = {
    // California
    'Los Angeles': ['Southern California'],
    'Orange County': ['Southern California'],
    'San Diego': ['Southern California'],
    'Santa Barbara': ['Southern California'],
    'Palm Springs': ['Southern California'],
    'San Francisco': ['Bay Area'],
    'San Jose': ['Bay Area'],
    'Oakland': ['Bay Area'],
    'Bay Area': ['Northern California'],
    'Sacramento': ['Northern California'],
    'Southern California': ['California'],
    'Northern California': ['California'],
    'California': ['USA'],
    // Other states and their cities
    'Houston': ['Texas'], 'Dallas': ['Texas'], 'Austin': ['Texas'], 'San Antonio': ['Texas'],
    'Texas': ['USA'],
    'Missoula': ['Montana'], 'Kalispell': ['Montana'],
    'Montana': ['USA'],
    'Harbor Springs': ['Michigan'],
    'Michigan': ['USA'],
    'Salt Lake City': ['Utah'], 'Utah': ['USA'],
    'Phoenix': ['Arizona'], 'Arizona': ['USA'],
    'Seattle': ['Washington State'], 'Washington State': ['USA'],
    'Atlanta': ['Georgia'], 'Georgia': ['USA'],
    'Boston': ['Massachusetts'], 'Massachusetts': ['USA'],
    'New York': ['New York State'], 'New York State': ['USA'],
    // International
    'Italy': ['Europe'],
  };

  // Alternate names. These make the search box understand "la county" or "socal",
  // and turn them into the standard name when typed into the form.
  const LOCATION_ALIASES = {
    'Los Angeles': ['LA', 'L.A.', 'LA County', 'Los Angeles County', 'Greater Los Angeles'],
    'Orange County': ['OC', 'O.C.'],
    'San Diego': ['San Diego County'],
    'San Francisco': ['SF', 'San Francisco County'],
    'Bay Area': ['San Francisco Bay Area', 'SF Bay Area'],
    'Southern California': ['SoCal', 'So Cal'],
    'Northern California': ['NorCal', 'Nor Cal'],
    'California': ['CA', 'Calif.'],
    'Texas': ['TX'],
    'New York': ['NYC', 'New York City'],
    'USA': ['US', 'U.S.', 'U.S.A.', 'United States', 'America'],
  };

  function locKey(s){ return String(s || '').trim().toLowerCase(); }

  const LOCATION_CANON = {};   // lowercased name or alias -> standard name
  [...ALL_LOCATIONS, ...Object.keys(LOCATION_PARENTS), ...[].concat(...Object.values(LOCATION_PARENTS))]
    .forEach(n => { LOCATION_CANON[locKey(n)] = n; });
  Object.keys(LOCATION_ALIASES).forEach(canon => {
    LOCATION_ALIASES[canon].forEach(a => { LOCATION_CANON[locKey(a)] = canon; });
  });
  const CATEGORY_CANON = {};
  ALL_CATEGORIES.forEach(c => { CATEGORY_CANON[locKey(c)] = c; });

  function canonicalLocation(text){ const t = String(text || '').trim(); return LOCATION_CANON[locKey(t)] || t; }
  function canonicalCategory(text){ const t = String(text || '').trim(); return CATEGORY_CANON[locKey(t)] || t; }
  function dedupeCI(arr){
    const seen = new Set(), out = [];
    arr.forEach(x => { const k = locKey(x); if (k && !seen.has(k)){ seen.add(k); out.push(x); } });
    return out;
  }

  // Vendors saved before this update have a single `category` / `location` string.
  // This upgrades them to lists on load (nothing is lost) and keeps the old single
  // fields in sync with the first entry, so an older cached copy of the page still
  // reads sensibly.
  function normalizeVendor(v){
    const rawCats = Array.isArray(v.categories) && v.categories.length ? v.categories : (v.category ? [v.category] : []);
    const rawLocs = Array.isArray(v.locations) && v.locations.length ? v.locations : (v.location ? [v.location] : []);
    const categories = dedupeCI(rawCats.map(c => canonicalCategory(c)));
    const locations = dedupeCI(rawLocs.map(l => canonicalLocation(l)));
    return { ...v, categories, locations, category: categories[0] || '', location: locations[0] || '' };
  }

  function ancestorsOf(term){
    const out = [], seen = new Set(), queue = [...(LOCATION_PARENTS[term] || [])];
    while (queue.length){
      const t = queue.shift();
      if (seen.has(t)) continue;
      seen.add(t); out.push(t);
      (LOCATION_PARENTS[t] || []).forEach(p => queue.push(p));
    }
    return out;
  }
  // Every area a vendor should be findable under: its own locations plus everything broader.
  function expandedLocationTerms(v){
    const set = new Set();
    (v.locations || []).forEach(l => { set.add(l); ancestorsOf(l).forEach(a => set.add(a)); });
    return [...set];
  }
  // Text the search box looks through for location matches (standard names + alternates).

    const out = [];

    return out.join(' | ');
  }

  function renderFilterBar(){
    // Filters only list categories/locations that at least one vendor is actually in.
    // (The full standard lists still feed the add/edit form.)
    const categories = uniqueSorted([].concat(...vendors.map(v => v.categories || [])));

    // Places vendors are directly tagged with, plus the broader areas that contain them
    const direct = new Set(), terms = new Set();
    vendors.forEach(v => {
      (v.locations || []).forEach(l => direct.add(l));
      expandedLocationTerms(v).forEach(t => terms.add(t));
    });

    // Drop a stale filter choice (e.g. the last vendor in that category was deleted)
    if (filters.category && !categories.includes(filters.category)) filters.category = '';
    if (filters.location && !terms.has(filters.location)) filters.location = '';

    const chipsHtml = categories.map(cat => {
      const active = filters.category === cat;
      return `<button class="chip ${active?'active':''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
    }).join('');
    el('categoryChips').innerHTML = chipsHtml || '<span style="font-size:13px;color:var(--ink-faint);">No categories yet</span>';

    el('categoryChips').querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const cat = chip.getAttribute('data-cat');
        filters.category = filters.category === cat ? '' : cat;
        render();
      });
    });

    const places = uniqueSorted([...direct]);
    // Broader areas, widest first (USA, then California, then Southern California...)
    const regions = [...terms].filter(t => !direct.has(t))
      .sort((a, b) => (ancestorsOf(a).length - ancestorsOf(b).length) || a.localeCompare(b));
    const opt = (loc) => `<option value="${escapeHtml(loc)}" ${loc===filters.location?'selected':''}>${escapeHtml(loc)}</option>`;
    el('locationSelect').innerHTML = '<option value="">All locations</option>' +
      (regions.length ? `<optgroup label="Broader areas">${regions.map(opt).join('')}</optgroup>` : '') +
      (places.length ? `<optgroup label="Places">${places.map(opt).join('')}</optgroup>` : '');

    el('filterBar').style.display = 'flex';
  }

  function matchesFilters(v){
    const s = filters.search.trim().toLowerCase();
    if (s){
      const hay = [v.name, v.contactName, v.notes, v.email, v.phone,
        (v.categories || []).join(' '), locationSearchText(v)].join(' ').toLowerCase();

    }
    if (filters.category && !(v.categories || []).includes(filters.category)) return false;
    if (filters.location && !expandedLocationTerms(v).includes(filters.location)) return false;
    return true;
  }

  // ---------- Clickable contact details ----------
  // Only real web addresses, email addresses and phone numbers become links. Anything
  // else a person types (including things like "javascript:...") stays plain, harmless text.
  function safeHttpUrl(raw){
    let t = String(raw || '').trim();
    if (!t) return null;
    if (!/^[a-z][a-z0-9+.\-]*:/i.test(t)) t = 'https://' + t;      // "mayesh.com" -> https://mayesh.com
    try {
      const u = new URL(t);
      if ((u.protocol === 'http:' || u.protocol === 'https:') && u.hostname.includes('.')) return u;
    } catch (e) { /* not a URL */ }
    return null;
  }
  function prettyUrl(u){ return (u.hostname.replace(/^www\./i, '') + u.pathname).replace(/\/+$/, ''); }
  function linkHtml(href, label, newTab){
    return `<a href="${escapeHtml(href)}"${newTab ? ' target="_blank" rel="noopener noreferrer"' : ''}>${escapeHtml(label)}</a>`;
  }
  function websiteHtml(raw){
    const u = safeHttpUrl(raw);
    return u ? linkHtml(u.href, prettyUrl(u), true) : escapeHtml(raw);
  }
  // Accepts a full Instagram link, or just a handle ("@name" or "name")
  function instagramInfo(raw){
    const t = String(raw || '').trim();
    const handle = t.match(/^@?([A-Za-z0-9._]{1,30})$/);
    if (handle) return { html: linkHtml('https://www.instagram.com/' + handle[1] + '/', '@' + handle[1], true), insta: true };
    const u = safeHttpUrl(t);
    if (!u) return { html: escapeHtml(t), insta: false };
    if (/(^|\.)instagram\.com$/i.test(u.hostname)){
      const seg = u.pathname.split('/').filter(Boolean)[0];
      return { html: linkHtml(u.href, seg ? '@' + seg : 'instagram.com', true), insta: true };
    }
    return { html: linkHtml(u.href, prettyUrl(u), true), insta: false };   // some other site typed in the Instagram box
  }
  // Turns every email / phone number found inside a piece of text into a link, leaving
  // the rest of the text (e.g. "Cell:" / "Office:") as is.
  function linkifyMatches(text, re, hrefFor){
    text = String(text || '');

  function phonesHtml(raw){
    return linkifyMatches(raw, PHONE_RE, (m) => {
      const d = m.replace(/\D/g, '');
      if (d.length === 11 && d[0] === '1') return 'tel:+' + d;
      if (d.length === 10) return 'tel:+1' + d;
      return null;
    });
  }
  function addressHtml(raw){
    return linkHtml('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(raw), raw, true);
  }
  const metaRow = (icon, html, cls) => `<div class="meta-row ${cls || ''}">${icon}<span class="meta-text">${html}</span></div>`;

  function renderCards(){
    if (!vendors.length){
      content.innerHTML = `
        <div class="empty-state">
          <h2>No vendors yet</h2>
          <p>Add your first vendor to start building the directory.</p>
          <button class="btn btn-primary" id="emptyAddBtn">+ Add vendor</button>
        </div>`;
      el('emptyAddBtn').addEventListener('click', openAddModal);
      return;
    }

    const visible = vendors.filter(matchesFilters).sort((a,b)=>a.name.localeCompare(b.name));
    const active = visible.filter(v => !v.doNotUse);
    const flagged = visible.filter(v => v.doNotUse);

    el('countLine').textContent = `${visible.length} of ${vendors.length} vendor${vendors.length===1?'':'s'}`;

    if (!visible.length){
      content.innerHTML = `<div class="empty-state"><h2>No matches</h2><p>Try a different search or clear your filters.</p></div>`;
      return;
    }

    let html = '';
    if (active.length){
      html += `<div class="grid">${active.map(v=>cardHtml(v)).join('')}</div>`;
    } else {
      html += `<div class="empty-state" style="padding:40px 20px;"><p>No active vendors match these filters.</p></div>`;
    }
    if (flagged.length){
      html += `
        <div class="dnu-section">
          <h3 class="dnu-heading">Do Not Use (${flagged.length})</h3>
          <div class="grid">${flagged.map(v=>cardHtml(v)).join('')}</div>
        </div>`;
    }
    content.innerHTML = html;

    content.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', (e)=>{
        if (e.target.closest('a')) return;            // let links open instead of the editor
        openEditModal(card.getAttribute('data-id'));
      });
      card.addEventListener('keydown', (e)=>{
        if (e.key === 'Enter' && !e.target.closest('a')) openEditModal(card.getAttribute('data-id'));
      });
    });
  }

  function cardHtml(v){
    const cats = (v.categories && v.categories.length) ? v.categories : ['Uncategorized'];
    const priceBits = [v.priceTier, v.leadTime].filter(Boolean).join(' · ');
    // One colored tab segment per category; flagged vendors get a single red tab instead
    const tabHtml = v.doNotUse
      ? `<div class="tab" style="background:var(--warn);">Do Not Use · ${escapeHtml(cats.join(', '))}</div>`
      : `<div class="tab tab-multi">${cats.map(c =>
          `<span class="tab-seg" title="${escapeHtml(c)}" style="background:${colorForCategory(c)};">${escapeHtml(c)}</span>`
        ).join('')}</div>`;
    return `
      <div class="card ${v.doNotUse ? 'card-dnu' : ''}" tabindex="0" data-id="${v.id}">
        ${tabHtml}
        <div class="card-body">
          <div class="vendor-name">${escapeHtml(v.name)}</div>
          ${(v.locations && v.locations.length) ? metaRow(iconPin(), escapeHtml(v.locations.join(' · '))) : ''}
          ${v.address ? metaRow(iconMap(), addressHtml(v.address)) : ''}
          ${v.contactName ? metaRow(iconPerson(), escapeHtml(v.contactName)) : ''}
          ${v.phone ? metaRow(iconPhone(), phonesHtml(v.phone)) : ''}
          ${v.email ? metaRow(iconMail(), emailsHtml(v.email)) : ''}
          ${v.website ? metaRow(iconGlobe(), websiteHtml(v.website), 'nowrap') : ''}
          ${v.instagram ? (() => { const ig = instagramInfo(v.instagram); return metaRow(ig.insta ? iconInstagram() : iconGlobe(), ig.html, 'nowrap'); })() : ''}
          ${priceBits ? `<div class="meta-row" style="color:var(--accent); font-weight:600;"><span class="meta-text">${escapeHtml(priceBits)}</span></div>` : ''}
          ${v.doNotUse && v.dnuReason ? `<div class="notes-preview" style="color:var(--warn);">${escapeHtml(v.dnuReason)}</div>` : ''}
          ${v.notes ? `<div class="notes-preview">${escapeHtml(v.notes)}</div>` : ''}
        </div>
      </div>`;
  }

  function render(){
    if (!loaded) return;
    renderFilterBar();
    renderCards();
  }

  // ---------- Modal ----------
  function modalHtml(v){
    v = v || {};
    return `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h2>${v.id ? 'Edit vendor' : 'Add vendor'}</h2>
          <div id="vendorForm">
            <div id="formError" style="display:none; background:#FBEAEA; border:1px solid #E3B8B8; color:var(--warn); border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px;"></div>
            <div class="field">
              <label for="f-name">Vendor name *</label>
              <input type="text" id="f-name" required value="${escapeHtml(v.name)}">
            </div>
            <div class="pick-group" id="pick-category">
              <span class="pick-label">Categories * <span style="font-weight:400;color:var(--ink-faint);">(pick all that apply)</span></span>
              <div class="pick-pills"></div>
              <div class="pick-add">
                <input type="text" class="pick-add-input" placeholder="Not listed? Type a new category">
                <button type="button" class="btn btn-ghost pick-add-btn">Add</button>
              </div>
            </div>
            <div class="pick-group" id="pick-location">
              <span class="pick-label">Locations * <span style="font-weight:400;color:var(--ink-faint);">(pick all that apply)</span></span>
              <div class="pick-pills"></div>
              <div class="pick-add">
                <input type="text" class="pick-add-input" placeholder="Not listed? Type a new location">
                <button type="button" class="btn btn-ghost pick-add-btn">Add</button>
              </div>
            </div>
            <div class="field">
              <label for="f-address">Address</label>
              <input type="text" id="f-address" value="${escapeHtml(v.address)}">
            </div>
            <div class="field-row">
              <div class="field">
                <label for="f-contact">Contact name</label>
                <input type="text" id="f-contact" value="${escapeHtml(v.contactName)}">
              </div>
              <div class="field">
                <label for="f-phone">Phone</label>
                <input type="text" id="f-phone" value="${escapeHtml(v.phone)}">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="f-email">Email</label>
                <input type="text" id="f-email" value="${escapeHtml(v.email)}">
              </div>
              <div class="field">
                <label for="f-website">Website</label>
                <input type="text" id="f-website" value="${escapeHtml(v.website)}">
              </div>
              <div class="field">
                <label for="f-instagram">Instagram</label>
                <input type="text" id="f-instagram" value="${escapeHtml(v.instagram)}">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="f-price">Price ($–$$$$$)</label>
                <input type="text" id="f-price" value="${escapeHtml(v.priceTier)}">
              </div>
              <div class="field">
                <label for="f-lead">Typical lead time</label>
                <input type="text" id="f-lead" value="${escapeHtml(v.leadTime)}">
              </div>
            </div>
            <div class="field">
              <label for="f-notes">Notes</label>
              <textarea id="f-notes">${escapeHtml(v.notes)}</textarea>
            </div>
            <div class="field dnu-field">
              <label class="dnu-checkbox-label">
                <input type="checkbox" id="f-dnu" ${v.doNotUse ? 'checked' : ''}>
                Do not use this vendor
              </label>
              <textarea id="f-dnu-reason" placeholder="Why? (e.g. missed deadline, poor quality, unresponsive)" style="display:${v.doNotUse ? 'block' : 'none'};">${escapeHtml(v.dnuReason)}</textarea>
            </div>
            <div class="modal-actions">
              <div>${v.id ? '<button type="button" class="btn-danger-text" id="deleteBtn">Delete vendor</button>' : '<span></span>'}</div>
              <div class="modal-actions-right">
                <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="submitBtn">${v.id ? 'Save changes' : 'Add vendor'}</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }

  function closeModal(){
    const overlay = el('overlay');
    if (overlay) overlay.remove();
    editingId = null;
  }

  function openAddModal(){
    editingId = null;
    document.body.insertAdjacentHTML('beforeend', modalHtml({}));
    bindModal();
  }

  function openEditModal(id){
    const v = vendors.find(x => x.id === id);
    if (!v) return;
    editingId = id;
    document.body.insertAdjacentHTML('beforeend', modalHtml(v));
    bindModal();
  }

  // Click-to-toggle pill picker used for Categories and Locations in the add/edit form.
  // `known` = the standard options; people can also type in new ones ("add other").
  // Values keep the order they were picked in; the first one is treated as the primary.
  function setupPicker(rootId, known, initial, canonicalize, pillColor){
    const root = el(rootId);
    const pillsEl = root.querySelector('.pick-pills');
    const input = root.querySelector('.pick-add-input');
    const addBtn = root.querySelector('.pick-add-btn');
    let options = uniqueSorted([...known, ...initial]);
    let selected = [...initial];

    function draw(){
      pillsEl.innerHTML = options.map(opt => {
        const on = selected.some(x => locKey(x) === locKey(opt));
        const style = on ? ` style="background:${pillColor(opt)};"` : '';
        return `<button type="button" class="pill${on ? ' on' : ''}" data-val="${escapeHtml(opt)}"${style}>${escapeHtml(opt)}</button>`;
      }).join('');
    }
    pillsEl.addEventListener('click', (e) => {
      const b = e.target.closest('.pill');
      if (!b) return;
      const val = b.getAttribute('data-val');
      const i = selected.findIndex(x => locKey(x) === locKey(val));
      if (i >= 0) selected.splice(i, 1); else selected.push(val);
      draw();
    });
    function addTyped(){
      const raw = input.value.trim();
      if (!raw) return;
      const canon = canonicalize(raw);                      // "LA" -> "Los Angeles", "stone" -> "Stone"
      const existing = options.find(o => locKey(o) === locKey(canon));
      const val = existing || canon;
      if (!existing) options = uniqueSorted([...options, val]);
      if (!selected.some(x => locKey(x) === locKey(val))) selected.push(val);
      input.value = '';
      draw();
    }
    addBtn.addEventListener('click', addTyped);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); addTyped(); } });
    draw();
    // Anything typed but not yet added still counts when the form is saved
    return { getValues: () => { addTyped(); return [...selected]; } };
  }

  function bindModal(){
    const current = editingId ? vendors.find(x => x.id === editingId) : null;
    const catPicker = setupPicker('pick-category',
      ALL_CATEGORIES.concat(...vendors.map(x => x.categories || [])),
      current ? (current.categories || []) : [],
      canonicalCategory, colorForCategory);
    const locPicker = setupPicker('pick-location',
      ALL_LOCATIONS.concat(...vendors.map(x => x.locations || [])),
      current ? (current.locations || []) : [],
      canonicalLocation, () => '#0E2841');

    el('overlay').addEventListener('click', (e)=>{ if (e.target.id === 'overlay') closeModal(); });
    el('cancelBtn').addEventListener('click', closeModal);
    el('f-dnu').addEventListener('change', (e)=>{
      el('f-dnu-reason').style.display = e.target.checked ? 'block' : 'none';
    });
    const del = el('deleteBtn');
    if (del) del.addEventListener('click', ()=>{
      if (confirm('Delete this vendor? This cannot be undone.')){
        vendors = vendors.filter(v => v.id !== editingId);
        closeModal();
        render();
        saveVendors();
      }
    });
    async function handleSave(){
      const categories = catPicker.getValues();
      const locations = locPicker.getValues();
      const data = {
        name: el('f-name').value.trim(),
        categories, locations,
        category: categories[0] || '',   // kept in sync for older copies of the page
        location: locations[0] || '',
        address: el('f-address').value.trim(),
        contactName: el('f-contact').value.trim(),
        phone: el('f-phone').value.trim(),
        email: el('f-email').value.trim(),
        website: el('f-website').value.trim(),
        instagram: el('f-instagram').value.trim(),
        priceTier: el('f-price').value.trim(),
        leadTime: el('f-lead').value.trim(),
        notes: el('f-notes').value.trim(),
        doNotUse: el('f-dnu').checked,
        dnuReason: el('f-dnu-reason').value.trim(),
      };
      const missing = [];
      if (!data.name) missing.push('Vendor name');
      if (!categories.length) missing.push('Category (pick at least one)');
      if (!locations.length) missing.push('Location (pick at least one)');
      const errBox = el('formError');
      if (missing.length){
        errBox.textContent = `Please fill in: ${missing.join(', ')}.`;
        errBox.style.display = 'block';
        if (typeof errBox.scrollIntoView === 'function'){
          errBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        return;
      }
      errBox.style.display = 'none';

      if (editingId){
        vendors = vendors.map(v => v.id === editingId ? {...v, ...data} : v);
      } else {
        data.id = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
        vendors.push(data);
      }
      closeModal();
      render();
      saveVendors();
    }
    el('submitBtn').addEventListener('click', handleSave);
    // Let Enter submit from any single-line text field, without relying on native form submission
    el('vendorForm').querySelectorAll('input[type="text"]:not(.pick-add-input)').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){
          e.preventDefault();
          handleSave();
        }
      });
    });
  }

  function exportToExcel(){
    const visible = vendors.filter(matchesFilters).sort((a,b)=>{
      if (a.category !== b.category) return (a.category||'').localeCompare(b.category||'');
      return (a.name||'').localeCompare(b.name||'');
    });
    if (!visible.length){
      alert('There are no vendors matching the current filters to export.');
      return;
    }

    const headers = ['Name','Category','Location','Address','Contact Name','Phone','Email',
      'Website','Instagram','Price Tier','Lead Time','Do Not Use','Do Not Use Reason','Notes'];

    const esc = (s) => String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    const headHtml = headers.map(h =>
      `<th style="background:#0E2841;color:#ffffff;font-weight:bold;padding:6px 10px;border:1px solid #ccc;">${esc(h)}</th>`
    ).join('');

    const rowsHtml = visible.map(v => {
      const knownColor = CATEGORY_COLORS[(v.categories || [])[0]];
      const catColor = v.doNotUse ? '#FBEAEA' : (knownColor || '#E8E8E8');
      const catText = v.doNotUse ? '#B3261E' : (knownColor ? '#ffffff' : '#0E2841');
      const rowBg = v.doNotUse ? '#FDF4F4' : '#ffffff';
      const cells = [
        v.name, (v.categories || []).join(', '), (v.locations || []).join(', '), v.address, v.contactName, v.phone, v.email,
        v.website, v.instagram, v.priceTier, v.leadTime,
        v.doNotUse ? 'Yes' : '', v.dnuReason, v.notes,
      ];
      return '<tr>' + cells.map((val, i) => {
        const isCategory = i === 1;
        const style = isCategory
          ? `background:${catColor};color:${catText};font-weight:bold;padding:6px 10px;border:1px solid #ccc;`
          : `background:${rowBg};padding:6px 10px;border:1px solid #ccc;`;
        return `<td style="${style}">${esc(val)}</td>`;
      }).join('') + '</tr>';
    }).join('');

    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>Vendors</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
</head>
<body>
<table style="border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt;">
<tr>${headHtml}</tr>
${rowsHtml}
</table>
</body>
</html>`;

    const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const filterNote = (filters.search || filters.category || filters.location) ? '-filtered' : '';
    const date = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vendor-directory${filterNote}-${date}.xls`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ---------- Wiring ----------
  el('addBtn').addEventListener('click', openAddModal);
  el('exportBtn').addEventListener('click', exportToExcel);
  el('searchInput').addEventListener('input', (e)=>{ filters.search = e.target.value; render(); });
  el('locationSelect').addEventListener('change', (e)=>{ filters.location = e.target.value; render(); });
  el('clearFilters').addEventListener('click', ()=>{
    filters = { search:'', category:'', location:'' };
    el('searchInput').value = '';
    render();
  });

  // The app no longer starts itself automatically — it waits for a successful
  // sign-in (see the auth block above), which then calls this.
  window.__startVendorApp = loadVendors;
})();
</script>
